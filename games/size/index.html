<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="../../css/style.css" />
  <title>Большой-маленький</title>
</head>
<body>
  <main class="game">
    <div class="game__top">
      <a class="game__home" href="../../index.html" aria-label="Домой">🏠</a>
      <button class="game__speak" id="say" aria-label="Повторить">🔊</button>
    </div>
    <h1 class="game__task" id="task"></h1>
    <div class="game__stage">
      <div class="size-row" id="row"></div>
    </div>
  </main>
  <script src="../../js/core.js"></script>
  <script>
    const SET = ['🐘', '🐶', '🦆', '🐟', '🐻', '🦁', '🐢', '🐧', '🐷'];
    const ROUNDS = 5;
    let round = 0;
    let phrase = '';

    const taskEl = document.getElementById('task');
    const rowEl = document.getElementById('row');
    document.getElementById('say').addEventListener('click', () => speak(phrase));

    function startRound() {
      const e = SET[Math.floor(Math.random() * SET.length)];
      const wantBig = Math.random() < 0.5;
      phrase = wantBig ? 'Где большой?' : 'Где маленький?';
      taskEl.textContent = phrase;
      speak(phrase);

      rowEl.innerHTML = '';
      // большой и маленький, стороны случайно
      shuffle(['big', 'small']).forEach((size) => {
        const b = document.createElement('button');
        b.className = 'size-item';
        b.textContent = e;
        b.dataset.size = size;
        b.style.fontSize =
          size === 'big'
            ? 'clamp(90px, 21vmin, 170px)'
            : 'clamp(38px, 9vmin, 68px)';
        b.setAttribute('aria-label', size === 'big' ? 'большой' : 'маленький');
        b.addEventListener('click', () => {
          const isBig = b.dataset.size === 'big';
          if (isBig === wantBig) {
            playSound('success');
            round++;
            setTimeout(() => {
              round >= ROUNDS ? showWin({ onAgain: restart }) : startRound();
            }, 850);
          } else {
            playSound('fail');
            b.classList.add('shake');
            setTimeout(() => b.classList.remove('shake'), 450);
          }
        });
        rowEl.appendChild(b);
      });
    }

    function restart() {
      round = 0;
      startRound();
    }

    showStart({ emoji: '🐘', label: '▶ Играть', onStart: startRound });
  </script>
</body>
</html>
