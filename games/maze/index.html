<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="../../css/style.css" />
  <title>Лабиринт</title>
</head>
<body>
  <main class="game">
    <div class="game__top">
      <a class="game__home" href="../../index.html" aria-label="Домой">🏠</a>
      <div class="game__hint" id="hint">Мышка → сыр 1/3</div>
    </div>
    <h1 class="game__task">Проведи мышку к сыру</h1>
    <div class="game__stage">
      <div class="maze-wrap">
        <canvas id="cv"></canvas>
      </div>
    </div>
  </main>
  <script src="../../js/core.js"></script>
  <script>
    // Стены — отрезки в координатах 0..1 (x1,y1,x2,y2)
    const MAZES = [
      { start: [0.12, 0.12], goal: [0.88, 0.88],
        walls: [[0, 0.35, 0.65, 0.35], [0.35, 0.65, 1, 0.65]] },
      { start: [0.12, 0.12], goal: [0.88, 0.88],
        walls: [[0, 0.3, 0.7, 0.3], [0.3, 0.55, 1, 0.55], [0, 0.8, 0.6, 0.8]] },
      // спираль: сыр в центре
      { start: [0.1, 0.1], goal: [0.5, 0.5],
        walls: [
          [0.28, 0.02, 0.28, 0.82], [0.28, 0.82, 0.82, 0.82],
          [0.82, 0.82, 0.82, 0.28], [0.82, 0.28, 0.46, 0.28], [0.46, 0.28, 0.46, 0.6],
        ] },
    ];
    const BALL = 0.055;   // радиус мышки
    const WALL_W = 0.05;  // толщина стен
    const GOAL_R = 0.07;

    let round = 0;
    let pos = [];
    let done = false;
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const hint = document.getElementById('hint');
    let S = 0; // размер холста в CSS-пикселях

    function maze() {
      return MAZES[round];
    }

    function fit() {
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const dpr = window.devicePixelRatio || 1;
      S = r.width;
      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      const m = maze();
      ctx.clearRect(0, 0, S, S);
      // сыр
      emoji('🧀', m.goal[0], m.goal[1], 0.14);
      // стены
      ctx.strokeStyle = '#c9ab7e';
      ctx.lineWidth = WALL_W * S;
      ctx.lineCap = 'round';
      m.walls.forEach(([x1, y1, x2, y2]) => {
        ctx.beginPath();
        ctx.moveTo(x1 * S, y1 * S);
        ctx.lineTo(x2 * S, y2 * S);
        ctx.stroke();
      });
      // мышка
      emoji('🐭', pos[0], pos[1], 0.12);
    }

    function emoji(ch, x, y, size) {
      ctx.font = Math.round(size * S) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, x * S, y * S + S * 0.005);
    }

    // расстояние от точки до отрезка (в нормированных координатах)
    function distToSeg(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy || 1)));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function clear(p) {
      // свободно ли: не задеваем стены и края поля
      if (p[0] < BALL || p[0] > 1 - BALL || p[1] < BALL || p[1] > 1 - BALL) return false;
      return maze().walls.every((w) => distToSeg(p[0], p[1], ...w) > BALL + WALL_W / 2);
    }

    function startMaze() {
      done = false;
      pos = [...maze().start];
      hint.textContent = `Мышка → сыр ${round + 1}/${MAZES.length}`;
      draw();
    }

    // движение к пальцу: маленькими шагами, через стену не пройдёт
    function moveBall(target) {
      if (done) return;
      let guard = 0;
      while (guard++ < 400) {
        const dx = target[0] - pos[0];
        const dy = target[1] - pos[1];
        const d = Math.hypot(dx, dy);
        if (d < 0.004) break;
        const step = Math.min(0.012, d);
        const next = [pos[0] + (dx / d) * step, pos[1] + (dy / d) * step];
        if (!clear(next)) break; // упёрлись в стену — стоим
        pos = next;
      }
      draw();
      if (Math.hypot(pos[0] - maze().goal[0], pos[1] - maze().goal[1]) < GOAL_R) {
        done = true;
        playSound('success');
        round++;
        setTimeout(() => {
          round >= MAZES.length
            ? showWin({ onAgain: restart })
            : startMaze();
        }, 900);
      }
    }

    const norm = (e) => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
    };
    let down = false;
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      down = true;
      try { cv.setPointerCapture(e.pointerId); } catch {}
      moveBall(norm(e));
    });
    cv.addEventListener('pointermove', (e) => {
      if (!down) return; // ведём только при нажатом пальце
      moveBall(norm(e));
    });
    const up = () => (down = false);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);

    function restart() {
      round = 0;
      startMaze();
    }

    window.addEventListener('resize', fit);
    showStart({ emoji: '🐭', label: '▶ Играть', onStart: () => { speak('Проведи мышку к сыру'); startMaze(); } });
    requestAnimationFrame(fit);
  </script>
</body>
</html>
