<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="../../css/style.css" />
  <title>Продолжи ряд</title>
</head>
<body>
  <main class="game">
    <div class="game__top">
      <a class="game__home" href="../../index.html" aria-label="Домой">🏠</a>
      <button class="game__speak" id="say" aria-label="Повторить">🔊</button>
    </div>
    <h1 class="game__task">Что дальше?</h1>
    <div class="game__stage">
      <div class="pattern-wrap">
        <div class="pattern-row" id="row"></div>
        <div class="options" id="opts"></div>
      </div>
    </div>
  </main>
  <script src="../../js/core.js"></script>
  <script>
    const POOL = ['🍎', '🍌', '🌟', '🎈', '🐟', '🌷', '🦋', '🍓'];
    const ROUNDS = 5;
    let round = 0;
    let busy = false; // пока идёт переход между раундами — клики не считаются
    const phrase = 'Продолжи ряд. Что дальше?';

    const rowEl = document.getElementById('row');
    const optsEl = document.getElementById('opts');
    document.getElementById('say').addEventListener('click', () => speak(phrase));

    function startRound() {
      busy = false;
      speak(phrase);
      // раунды 1–2: АБАБ, 3–4: ААББ, 5: АБВАБВ
      const [a, b, c] = shuffle(POOL);
      let seq;
      if (round < 2) seq = [a, b, a, b];
      else if (round < 4) seq = [a, a, b, b];
      else seq = [a, b, c, a, b, c];
      const ans = seq[seq.length - 1];

      rowEl.innerHTML = '';
      seq.slice(0, -1).forEach((e) => {
        const s = document.createElement('span');
        s.className = 'pat-cell';
        s.textContent = e;
        rowEl.appendChild(s);
      });
      const q = document.createElement('span');
      q.className = 'pat-cell pat-cell--q';
      q.textContent = '?';
      rowEl.appendChild(q);

      optsEl.innerHTML = '';
      const options = shuffle([ans, ...shuffle(POOL.filter((p) => p !== ans)).slice(0, 2)]);
      options.forEach((val) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = val;
        btn.setAttribute('aria-label', 'вариант');
        btn.addEventListener('click', () => {
          if (busy) return;
          if (val === ans) {
            busy = true;
            q.textContent = val;
            q.classList.remove('pat-cell--q');
            playSound('success');
            round++;
            setTimeout(() => {
              round >= ROUNDS ? showWin({ onAgain: restart }) : startRound();
            }, 900);
          } else {
            playSound('fail');
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 450);
          }
        });
        optsEl.appendChild(btn);
      });
    }

    function restart() {
      round = 0;
      startRound();
    }

    showStart({ emoji: '🔢', label: '▶ Играть', onStart: startRound });
  </script>
</body>
</html>
