<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="../../css/style.css" />
  <title>Звуки</title>
</head>
<body>
  <main class="game">
    <div class="game__top">
      <a class="game__home" href="../../index.html" aria-label="Домой">🏠</a>
      <div class="game__hint">Кто живёт на дворе?</div>
    </div>
    <div class="game__stage">
      <div class="zoo" id="zoo"></div>
    </div>
  </main>
  <script src="../../js/core.js"></script>
  <script>
    // Настоящие записи с Mixkit (свободная лицензия, без атрибуции)
    const ANIMALS = [
      { e: '🐄', name: 'Корова', file: 'cow' },
      { e: '🐕', name: 'Собака', file: 'dog' },
      { e: '🐈', name: 'Кошка', file: 'cat' },
      { e: '🐑', name: 'Овечка', file: 'sheep' },
      { e: '🐖', name: 'Поросёнок', file: 'pig' },
      { e: '🐴', name: 'Лошадь', file: 'horse' },
      { e: '🐓', name: 'Петух', file: 'rooster' },
      { e: '🐔', name: 'Курочка', file: 'chicken' },
    ];

    const zoo = document.getElementById('zoo');
    const heard = new Set();
    let currentAudio = null;

    function playAnimal(a) {
      if (!Settings.soundOn()) return;
      // быстрое повторное тыканье: глушим предыдущую дорожку
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      const audio = new Audio(`../../assets/sounds/${a.file}.wav`);
      currentAudio = audio;
      audio.play().catch(() => {}); // если не смог — имя всё равно произнесётся
    }

    ANIMALS.forEach((a) => {
      const b = document.createElement('button');
      b.className = 'animal';
      b.innerHTML = `${a.e}<small>${a.name}</small>`;
      b.addEventListener('click', () => {
        playAnimal(a);
        setTimeout(() => speak(a.name), 250); // имя поверх звука, не одновременно
        heard.add(a.file);
        b.classList.add('is-heard');
        if (heard.size === ANIMALS.length) {
          // всех послушали — праздник; потом начинаем заново
          setTimeout(() => {
            showWin({
              onAgain: () => {
                heard.clear();
                zoo.querySelectorAll('.animal').forEach((el) => el.classList.remove('is-heard'));
              },
            });
          }, 900);
        }
      });
      zoo.appendChild(b);
    });
  </script>
</body>
</html>
