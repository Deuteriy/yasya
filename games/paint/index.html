<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="../../css/style.css" />
  <title>Раскраска</title>
</head>
<body>
  <main class="game">
    <div class="game__top">
      <a class="game__home" href="../../index.html" aria-label="Домой">🏠</a>
      <button class="game__speak" id="back" aria-label="Картинки">🖼️</button>
    </div>
    <h1 class="game__task" id="title">Что раскрасим?</h1>
    <div class="game__stage">
      <div class="paint-picker" id="picker"></div>
      <div class="paint-wrap" id="wrap" hidden>
        <div class="easel">
          <canvas id="cv"></canvas>
          <div class="outline" id="outline"></div>
        </div>
        <div class="palette" id="palette"></div>
        <button class="btn" id="done">✨ Готово</button>
      </div>
    </div>
  </main>
  <script src="../../js/core.js"></script>
  <script>
    // Пул картинок: эмодзи превращается в контур для раскраски автоматически
    // (обводка силуэта + внутренних цветовых зон), поэтому рисунки узнаваемые
    const PICTURES = [
      { e: '🐱', name: 'Кошечка', acc: 'кошечку' },
      { e: '🐶', name: 'Собачка', acc: 'собачку' },
      { e: '🐰', name: 'Зайчик', acc: 'зайчика' },
      { e: '🦊', name: 'Лисёнок', acc: 'лисёнка' },
      { e: '🐻', name: 'Мишка', acc: 'мишку' },
      { e: '🐸', name: 'Лягушка', acc: 'лягушку' },
      { e: '🦆', name: 'Уточка', acc: 'уточку' },
      { e: '🦋', name: 'Бабочка', acc: 'бабочку' },
      { e: '🐞', name: 'Божья коровка', acc: 'божью коровку' },
      { e: '🌻', name: 'Подсолнух', acc: 'цветок' },
      { e: '🌳', name: 'Дерево', acc: 'дерево' },
      { e: '🍎', name: 'Яблоко', acc: 'яблоко' },
      { e: '🍓', name: 'Клубника', acc: 'клубнику' },
      { e: '🚗', name: 'Машинка', acc: 'машинку' },
      { e: '🚀', name: 'Ракета', acc: 'ракету' },
      { e: '🎈', name: 'Шарик', acc: 'шарик' },
    ];

    // ===== Генератор контуров из эмодзи =====
    const outlineCache = new Map();
    function outlineURL(emoji) {
      if (outlineCache.has(emoji)) return outlineCache.get(emoji);
      const S = 560;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.font = Math.round(S * 0.78) +
        'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText(emoji, S / 2, S / 2 + S * 0.04);
      const src = x.getImageData(0, 0, S, S).data;

      const out = document.createElement('canvas');
      out.width = out.height = S;
      const octx = out.getContext('2d');
      const od = octx.createImageData(S, S);
      const D = od.data;
      const edge = new Uint8Array(S * S);
      const T = 70; // порог перепада: контур силуэта + границы цветов внутри

      for (let y = 1; y < S - 1; y++) {
        for (let xx = 1; xx < S - 1; xx++) {
          const i = (y * S + xx) * 4;
          const ir = i + 4;      // сосед справа
          const id = i + S * 4;  // сосед снизу
          const dA = Math.abs(src[i + 3] - src[ir + 3]) + Math.abs(src[i + 3] - src[id + 3]);
          const dC =
            Math.abs(src[i] - src[ir]) + Math.abs(src[i + 1] - src[ir + 1]) +
            Math.abs(src[i + 2] - src[ir + 2]) + Math.abs(src[i] - src[id]) +
            Math.abs(src[i + 1] - src[id + 1]) + Math.abs(src[i + 2] - src[id + 2]);
          if (dA + dC * 0.45 > T) edge[y * S + xx] = 1;
        }
      }

      // утолщаем линии (радиус 2) и красим тёмно-коричневым
      for (let y = 0; y < S; y++) {
        for (let xx = 0; xx < S; xx++) {
          if (!edge[y * S + xx]) continue;
          for (let dy = -2; dy <= 2; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const yy = y + dy;
              const x2 = xx + dx;
              if (yy < 0 || x2 < 0 || yy >= S || x2 >= S) continue;
              const j = (yy * S + x2) * 4;
              D[j] = 74;
              D[j + 1] = 59;
              D[j + 2] = 42;
              D[j + 3] = 255;
            }
          }
        }
      }
      octx.putImageData(od, 0, 0);
      const url = out.toDataURL();
      outlineCache.set(emoji, url);
      return url;
    }

    const COLORS = [
      '#ff5a5f', '#ff9f43', '#ffd93d', '#6bcb77',
      '#4d96ff', '#3f5fd8', '#c084fc', '#ff8fc7', '#a0714f',
    ];

    let color = COLORS[0];
    let erasing = false;
    const strokes = []; // { color, erase, pts:[[nx,ny] 0..1] } — для перерисовки при повороте
    let current = null;

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const outline = document.getElementById('outline');
    const palette = document.getElementById('palette');
    const picker = document.getElementById('picker');
    const wrap = document.getElementById('wrap');
    const title = document.getElementById('title');
    let W = 0; // CSS-размер холста

    // ===== Экран выбора картинки =====
    PICTURES.forEach((p) => {
      const b = document.createElement('button');
      b.className = 'thumb';
      b.innerHTML = `${p.e}<small>${p.name}</small>`;
      b.addEventListener('click', () => {
        playSound('pop');
        openPicture(p);
      });
      picker.appendChild(b);
    });

    function showPicker() {
      title.textContent = 'Что раскрасим?';
      wrap.hidden = true;
      picker.hidden = false;
    }

    function openPicture(p) {
      title.textContent = p.name;
      outline.innerHTML = `<img src="${outlineURL(p.e)}" alt="">`;
      strokes.length = 0;
      current = null;
      picker.hidden = true;
      wrap.hidden = false;
      speak(`Раскрась ${p.acc}`);
      // холст мог поменять размер — подгоняем
      requestAnimationFrame(fit);
    }

    // ===== Холст =====
    function fit() {
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const dpr = window.devicePixelRatio || 1;
      W = r.width;
      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }

    function redraw() {
      ctx.clearRect(0, 0, W, W);
      strokes.forEach((s) => paintStroke(s, 0, s.pts.length));
    }

    // рисует штрих s: точки с from до to (для инкрементальной дорисовки)
    function paintStroke(s, from, to) {
      ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle = s.color;
      ctx.fillStyle = s.color;
      ctx.lineWidth = W * 0.085; // толстая кисточка
      ctx.lineCap = ctx.lineJoin = 'round';
      const p = s.pts;
      if (to - from === 1 && p.length === 1) {
        ctx.beginPath();
        ctx.arc(p[0][0] * W, p[0][1] * W, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(p[from][0] * W, p[from][1] * W);
      for (let i = from + 1; i < to; i++) ctx.lineTo(p[i][0] * W, p[i][1] * W);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    const norm = (e) => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
    };

    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try {
        cv.setPointerCapture(e.pointerId);
      } catch {}
      current = { color, erase: erasing, pts: [norm(e)] };
      paintStroke(current, 0, 1);
    });

    cv.addEventListener('pointermove', (e) => {
      if (!current) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of evs) {
        const from = current.pts.length - 1;
        current.pts.push(norm(ev));
        paintStroke(current, from, current.pts.length);
      }
    });

    const endStroke = () => {
      if (current) {
        strokes.push(current);
        current = null;
      }
    };
    cv.addEventListener('pointerup', endStroke);
    cv.addEventListener('pointercancel', endStroke);

    // палитра: цвета + ластик
    const swatches = [];
    function select(el) {
      swatches.forEach((s) => s.classList.remove('sel'));
      el.classList.add('sel');
    }
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      if (i === 0) b.classList.add('sel');
      b.setAttribute('aria-label', 'цвет');
      b.addEventListener('click', () => {
        color = c;
        erasing = false;
        select(b);
        playSound('pop');
      });
      palette.appendChild(b);
      swatches.push(b);
    });
    const er = document.createElement('button');
    er.className = 'swatch swatch--erase';
    er.textContent = '🧽';
    er.setAttribute('aria-label', 'ластик');
    er.addEventListener('click', () => {
      erasing = true;
      select(er);
      playSound('pop');
    });
    palette.appendChild(er);
    swatches.push(er);

    document.getElementById('done').addEventListener('click', () => {
      speak('Ух ты, красота!');
      showWin({ onAgain: showPicker });
    });

    document.getElementById('back').addEventListener('click', () => {
      playSound('pop');
      showPicker();
    });

    // поворот iPad — перерисовать сохранённые штрихи под новый размер
    window.addEventListener('resize', fit);

    showStart({ emoji: '🖍️', label: '▶ Раскрасить', onStart: () => { speak('Что будем раскрашивать?'); showPicker(); } });
  </script>
</body>
</html>
