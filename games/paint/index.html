<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="../../css/style.css" />
  <title>Раскраска</title>
</head>
<body>
  <main class="game">
    <div class="game__top">
      <a class="game__home" href="../../index.html" aria-label="Домой">🏠</a>
      <button class="game__speak" id="back" aria-label="Картинки">🖼️</button>
    </div>
    <h1 class="game__task" id="title">Что раскрасим?</h1>
    <div class="game__stage">
      <div class="paint-picker" id="picker"></div>
      <div class="paint-wrap" id="wrap" hidden>
        <div class="easel">
          <canvas id="cv"></canvas>
          <div class="outline" id="outline"></div>
        </div>
        <div class="palette" id="palette"></div>
        <button class="btn" id="done">✨ Готово</button>
      </div>
    </div>
  </main>
  <script src="../../js/core.js"></script>
  <script>
    // Контурные картинки: области соприкасаются краями, не пересекаясь,
    // чтобы линии не создавали кашу под пальцем
    const PICTURES = [
      { e: '🏠', name: 'Домик', svg: `
        <polygon class="fillzone" points="100,14 182,88 18,88"/>
        <rect class="fillzone" x="36" y="88" width="128" height="88"/>
        <circle class="fillzone" cx="68" cy="122" r="15"/>
        <rect class="fillzone" x="86" y="132" width="32" height="44" rx="3"/>` },
      { e: '🎄', name: 'Ёлочка', svg: `
        <rect class="fillzone" x="88" y="150" width="24" height="34" rx="3"/>
        <polygon class="fillzone" points="100,18 64,62 136,62"/>
        <polygon class="fillzone" points="100,64 46,108 154,108"/>
        <polygon class="fillzone" points="100,110 28,148 172,148"/>` },
      { e: '🌸', name: 'Цветочек', svg: `
        <rect class="fillzone" x="96" y="118" width="8" height="64" rx="4"/>
        <ellipse class="fillzone" cx="80" cy="152" rx="20" ry="10" transform="rotate(-35 80 152)"/>
        <circle class="fillzone" cx="100" cy="50" r="19"/>
        <circle class="fillzone" cx="134" cy="75" r="19"/>
        <circle class="fillzone" cx="121" cy="115" r="19"/>
        <circle class="fillzone" cx="79" cy="115" r="19"/>
        <circle class="fillzone" cx="66" cy="75" r="19"/>
        <circle class="fillzone" cx="100" cy="86" r="14"/>` },
      { e: '🐟', name: 'Рыбка', svg: `
        <polygon class="fillzone" points="138,100 190,64 184,136"/>
        <polygon class="fillzone" points="78,66 92,40 106,66"/>
        <ellipse class="fillzone" cx="86" cy="100" rx="52" ry="34"/>
        <circle class="fillzone" cx="52" cy="92" r="8"/>` },
      { e: '🦋', name: 'Бабочка', svg: `
        <ellipse class="fillzone" cx="58" cy="70" rx="34" ry="28"/>
        <ellipse class="fillzone" cx="142" cy="70" rx="34" ry="28"/>
        <ellipse class="fillzone" cx="58" cy="134" rx="34" ry="28"/>
        <ellipse class="fillzone" cx="142" cy="134" rx="34" ry="28"/>
        <ellipse class="fillzone" cx="100" cy="100" rx="11" ry="44"/>` },
      { e: '🚗', name: 'Машинка', svg: `
        <path class="fillzone" d="M56 104 L76 70 H124 L144 104 Z"/>
        <rect class="fillzone" x="20" y="104" width="160" height="34" rx="12"/>
        <rect class="fillzone" x="82" y="76" width="36" height="24" rx="4"/>
        <circle class="fillzone" cx="56" cy="156" r="18"/>
        <circle class="fillzone" cx="144" cy="156" r="18"/>` },
      { e: '🚀', name: 'Ракета', svg: `
        <polygon class="fillzone" points="72,110 40,160 72,160"/>
        <polygon class="fillzone" points="128,110 160,160 128,160"/>
        <polygon class="fillzone" points="100,14 128,70 128,150 72,150 72,70"/>
        <circle class="fillzone" cx="100" cy="92" r="16"/>
        <polygon class="fillzone" points="84,150 116,150 100,194"/>` },
      { e: '🌳', name: 'Дерево', svg: `
        <rect class="fillzone" x="88" y="130" width="24" height="56" rx="4"/>
        <circle class="fillzone" cx="100" cy="78" r="52"/>
        <circle class="fillzone" cx="78" cy="66" r="9"/>
        <circle class="fillzone" cx="124" cy="84" r="9"/>
        <circle class="fillzone" cx="92" cy="100" r="8"/>` },
      { e: '🍄', name: 'Грибок', svg: `
        <path class="fillzone" d="M28 110 A72 60 0 0 1 172 110 Z"/>
        <rect class="fillzone" x="76" y="112" width="48" height="62" rx="10"/>
        <circle class="fillzone" cx="75" cy="80" r="8"/>
        <circle class="fillzone" cx="118" cy="72" r="7"/>
        <circle class="fillzone" cx="100" cy="95" r="6"/>` },
      { e: '☀️', name: 'Солнышко', svg: `
        <circle class="fillzone" cx="100" cy="100" r="38"/>
        <polygon class="fillzone" points="140,90 168,100 140,110"/>
        <polygon class="fillzone" points="121.2,135.4 148.1,148.1 135.4,121.2"/>
        <polygon class="fillzone" points="90,140 100,168 110,140"/>
        <polygon class="fillzone" points="78.8,135.4 51.9,148.1 64.6,121.2"/>
        <polygon class="fillzone" points="60,90 32,100 60,110"/>
        <polygon class="fillzone" points="78.8,64.6 51.9,51.9 64.6,78.8"/>
        <polygon class="fillzone" points="110,60 100,32 90,60"/>
        <polygon class="fillzone" points="121.2,64.6 148.1,51.9 135.4,78.8"/>` },
      { e: '🍦', name: 'Мороженое', svg: `
        <circle class="fillzone" cx="100" cy="70" r="40"/>
        <polygon class="fillzone" points="60,110 140,110 100,190"/>
        <circle class="fillzone" cx="100" cy="22" r="8"/>` },
      { e: '🧁', name: 'Кексик', svg: `
        <ellipse class="fillzone" cx="100" cy="38" rx="6" ry="9"/>
        <rect class="fillzone" x="96" y="46" width="8" height="30" rx="2"/>
        <path class="fillzone" d="M52 118 A48 42 0 0 1 148 118 Z"/>
        <polygon class="fillzone" points="62,118 138,118 152,172 48,172"/>` },
      { e: '⛵', name: 'Кораблик', svg: `
        <polygon class="fillzone" points="28,138 172,138 150,170 50,170"/>
        <rect class="fillzone" x="96" y="48" width="8" height="90"/>
        <polygon class="fillzone" points="106,54 106,130 168,130"/>
        <polygon class="fillzone" points="104,48 134,56 104,64"/>` },
      { e: '🍎', name: 'Яблоко', svg: `
        <circle class="fillzone" cx="100" cy="112" r="54"/>
        <rect class="fillzone" x="96" y="30" width="8" height="28" rx="3"/>
        <ellipse class="fillzone" cx="122" cy="46" rx="16" ry="9" transform="rotate(-30 122 46)"/>` },
      { e: '🎈', name: 'Шарик', svg: `
        <ellipse class="fillzone" cx="100" cy="82" rx="44" ry="54"/>
        <polygon class="fillzone" points="100,136 92,148 108,148"/>
        <line class="fillzone" x1="92" y1="148" x2="86" y2="158"/>
        <line class="fillzone" x1="108" y1="148" x2="114" y2="158"/>
        <rect class="fillzone" x="84" y="158" width="32" height="26" rx="6"/>` },
      { e: '❤️', name: 'Сердечко', svg: `
        <path class="fillzone" d="M100 178 C 34 128 20 68 58 50 C 86 37 100 58 100 74 C 100 58 114 37 142 50 C 180 68 166 128 100 178 Z"/>` },
    ];

    const COLORS = [
      '#ff5a5f', '#ff9f43', '#ffd93d', '#6bcb77',
      '#4d96ff', '#3f5fd8', '#c084fc', '#ff8fc7', '#a0714f',
    ];

    let color = COLORS[0];
    let erasing = false;
    const strokes = []; // { color, erase, pts:[[nx,ny] 0..1] } — для перерисовки при повороте
    let current = null;

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const outline = document.getElementById('outline');
    const palette = document.getElementById('palette');
    const picker = document.getElementById('picker');
    const wrap = document.getElementById('wrap');
    const title = document.getElementById('title');
    let W = 0; // CSS-размер холста

    // ===== Экран выбора картинки =====
    PICTURES.forEach((p) => {
      const b = document.createElement('button');
      b.className = 'thumb';
      b.innerHTML = `${p.e}<small>${p.name}</small>`;
      b.addEventListener('click', () => {
        playSound('pop');
        openPicture(p);
      });
      picker.appendChild(b);
    });

    function showPicker() {
      title.textContent = 'Что раскрасим?';
      wrap.hidden = true;
      picker.hidden = false;
    }

    function openPicture(p) {
      title.textContent = p.name;
      outline.innerHTML = `<svg viewBox="0 0 200 200" class="paint-svg">${p.svg}</svg>`;
      strokes.length = 0;
      current = null;
      picker.hidden = true;
      wrap.hidden = false;
      speak(`Раскрась ${p.name.toLowerCase()}`);
      // холст мог поменять размер — подгоняем
      requestAnimationFrame(fit);
    }

    // ===== Холст =====
    function fit() {
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const dpr = window.devicePixelRatio || 1;
      W = r.width;
      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }

    function redraw() {
      ctx.clearRect(0, 0, W, W);
      strokes.forEach((s) => paintStroke(s, 0, s.pts.length));
    }

    // рисует штрих s: точки с from до to (для инкрементальной дорисовки)
    function paintStroke(s, from, to) {
      ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle = s.color;
      ctx.fillStyle = s.color;
      ctx.lineWidth = W * 0.085; // толстая кисточка
      ctx.lineCap = ctx.lineJoin = 'round';
      const p = s.pts;
      if (to - from === 1 && p.length === 1) {
        ctx.beginPath();
        ctx.arc(p[0][0] * W, p[0][1] * W, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(p[from][0] * W, p[from][1] * W);
      for (let i = from + 1; i < to; i++) ctx.lineTo(p[i][0] * W, p[i][1] * W);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    const norm = (e) => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
    };

    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try {
        cv.setPointerCapture(e.pointerId);
      } catch {}
      current = { color, erase: erasing, pts: [norm(e)] };
      paintStroke(current, 0, 1);
    });

    cv.addEventListener('pointermove', (e) => {
      if (!current) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of evs) {
        const from = current.pts.length - 1;
        current.pts.push(norm(ev));
        paintStroke(current, from, current.pts.length);
      }
    });

    const endStroke = () => {
      if (current) {
        strokes.push(current);
        current = null;
      }
    };
    cv.addEventListener('pointerup', endStroke);
    cv.addEventListener('pointercancel', endStroke);

    // палитра: цвета + ластик
    const swatches = [];
    function select(el) {
      swatches.forEach((s) => s.classList.remove('sel'));
      el.classList.add('sel');
    }
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      if (i === 0) b.classList.add('sel');
      b.setAttribute('aria-label', 'цвет');
      b.addEventListener('click', () => {
        color = c;
        erasing = false;
        select(b);
        playSound('pop');
      });
      palette.appendChild(b);
      swatches.push(b);
    });
    const er = document.createElement('button');
    er.className = 'swatch swatch--erase';
    er.textContent = '🧽';
    er.setAttribute('aria-label', 'ластик');
    er.addEventListener('click', () => {
      erasing = true;
      select(er);
      playSound('pop');
    });
    palette.appendChild(er);
    swatches.push(er);

    document.getElementById('done').addEventListener('click', () => {
      speak('Ух ты, красота!');
      showWin({ onAgain: showPicker });
    });

    document.getElementById('back').addEventListener('click', () => {
      playSound('pop');
      showPicker();
    });

    // поворот iPad — перерисовать сохранённые штрихи под новый размер
    window.addEventListener('resize', fit);

    showStart({ emoji: '🖍️', label: '▶ Раскрасить', onStart: () => { speak('Что будем раскрашивать?'); showPicker(); } });
  </script>
</body>
</html>
